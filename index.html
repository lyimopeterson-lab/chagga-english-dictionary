
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chagga English Dictionary</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f1f5f9;
  margin: 0;
  padding: 20px;
}
.container {
  max-width: 600px;
  margin: auto;
  background: white;
  padding: 20px;
  border-radius: 12px;
}
h1 {
  text-align: center;
  color: #087443;
}
input {
  width: 100%;
  padding: 14px;
  box-sizing: border-box;
  border: 1px solid #aaa;
  border-radius: 8px;
  font-size: 16px;
}
.result {
  padding: 14px;
  border-bottom: 1px solid #ddd;
}
</style>
</head>
<body>
<div class="container">
<h1>CHAGGA - ENGLISH DICTIONARY</h1>
<p>Search Chagga or English words</p>

<input type="text" id="search"
placeholder="Tafuta neno hapa...">

<div id="results">
<p>Karibu kwenye Kamusi ya Kichagga.</p>
</div>
</div>

<script>
const words = [
];

const search = document.getElementById("search");
const results = document.getElementById("results");

search.addEventListener("input", function() {
  const query = this.value.toLowerCase().trim();

  const found = words.filter(word =>
    word.chagga.toLowerCase().includes(query) ||
    word.english.toLowerCase().includes(query)
  );

  results.innerHTML = found.length
    ? found.map(word =>
      `<div class="result">
      <b>${word.chagga}</b><br>
      ${word.english}
      </div>`
    ).join("")
    : "<p>Hakuna neno lililopatikana.</p>";
});
</script>
</body>
</html>
